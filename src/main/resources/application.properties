spring.application.name=likehub

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/likehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:likehub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:likehub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

spring.profiles.active=dev
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis


spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:likehub}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.likehub.likehub

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.web.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Armazenamento local (profile dev)
app.storage.local.root=${APP_STORAGE_LOCAL_ROOT:./uploads}
app.storage.local.public-base-url=${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/uploads}

